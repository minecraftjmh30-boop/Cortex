[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex"
version = "0.1.0"
description = "a artifical butler created by jack hackett and lincoln stuller"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Jack Hackett", email = "hackettjack30@gmail.com" }
]
dependencies = [
    "python-kasa>=0.10.2",
    "pygame-ce>=2.5.7",
    "SpeechRecognition>=3.17.0",
    "pyttsx3>=2.99",
    "PyAudio>=0.2.14",
    "cryptography>=42.0.0",
    "aiohttp>=3.9.0",
    "colorama>=0.4.6",
    "piper-tts>=1.6.0",
    "numpy>=2.5.1",
    "sounddevice>=0.5.5"
]

[project.optional-dependencies]
linux = [
    "PyAudio>=0.2.14", # Specifically requires portaudio19-dev on system
]


[project.scripts]
cortex = "main:main"

[tool.setuptools]
packages = ["audio", "command", "command.functions", "command.keys"]