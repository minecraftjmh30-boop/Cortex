[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex"
version = "0.1.0"
description = "A voice-controlled home automation assistant using Kasa devices"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Jack Hackett", email = "hackettjack30@gmail.com" }
]
keywords = ["kasa", "iot", "voice-control", "automation"]
dependencies = [
    "python-kasa>=0.10.2",
    "pygame>=2.6.1",
    "SpeechRecognition>=3.17.0",
    "pyttsx3>=2.99",
    "PyAudio>=0.2.14",
    "cryptography>=42.0.0",
    "aiohttp>=3.9.0",
]

[project.scripts]
cortex = "main:main"

[tool.setuptools]
packages = ["audio", "command", "command.functions", "command.keys"]
